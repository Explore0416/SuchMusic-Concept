name: Android Build & Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write   # 发布 Release 需要写权限

jobs:
  build:
    name: Analyze · Test · Build Signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Set up Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Flutter version
        run: flutter --version

      # 仓库内 Gradle wrapper 指向腾讯云镜像（方便国内本地构建）；
      # GitHub 构建机在国外，切回官方分发源更稳更快。仅改 CI 时的临时文件。
      - name: Use official Gradle distribution on CI
        run: |
          sed -i 's|^distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-9.1.0-all.zip|' \
            android/gradle/wrapper/gradle-wrapper.properties
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: Install dependencies
        run: flutter pub get

      # 版本号随推送自动更新：
      #   · 推送 main/master：versionName = <pubspec 的 major.minor>.<run_number>，
      #     versionCode = run_number（单调递增，保证每次构建都能覆盖安装）；
      #   · 推送 v* 标签：versionName 取标签号（去掉前缀 v），versionCode 仍用 run_number。
      # 这样无需手动改版本号，每次 push 产出的 APK 版本号都会自动递增。
      - name: Resolve version
        run: |
          BASE=$(grep -E '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          MAJOR_MINOR=$(echo "$BASE" | cut -d'.' -f1-2)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            VERSION_NAME="${MAJOR_MINOR}.${{ github.run_number }}"
          fi
          VERSION_CODE="${{ github.run_number }}"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "resolved -> versionName=$VERSION_NAME versionCode=$VERSION_CODE"

      # 只分析应用自身代码；vendored 包 packages/netease_music_api/test 含需要私密配置的
      # 上游用例，纳入分析会产生噪声，故与本地保持一致，限定 lib 与 test
      - name: Static analysis
        run: flutter analyze lib test

      - name: Unit / widget tests
        run: flutter test

      # 手环 SDK（小米 xms-wearable-lib）：**专有许可，禁止随仓库分发**，故不入库。
      # 采用「构建时自动加上」——从**私有 Release 资源**临时拉取到 android/app/libs/，
      # 编译进 APK 后即随运行器销毁，AAR 从不出现在任何公开产物中（合规）。
      # 未配置 secret（如公开 fork）时自动跳过 → 优雅降级为 Noop，构建照常通过。
      # 详见 android/app/build.gradle.kts：仅当 libs/ 下存在该 AAR 时才加入依赖。
      - name: Fetch Xiaomi wearable AAR (private, not redistributed)
        env:
          GH_TOKEN: ${{ secrets.WEARABLE_AAR_PAT }}
        run: |
          # 注意：GitHub Actions 的 `if:` 条件不支持 secrets 上下文，故在 run 内判断。
          if [ -z "$GH_TOKEN" ]; then
            echo "未配置 WEARABLE_AAR_PAT → 跳取手环 SDK，优雅降级为 Noop（构建照常通过）"
            exit 0
          fi
          mkdir -p android/app/libs
          gh release download xms-wearable-lib \
            -R Explore0416/SuchMusic-SDK \
            -p 'xms-wearable-lib*.aar' \
            -D android/app/libs --clobber
          ls -lh android/app/libs
          test -n "$(ls -A android/app/libs)" || { echo "::error::AAR 拉取失败，未能启用真机通信" >&2; exit 1; }

      # 签名材料不入库：从 Secrets 还原 keystore 与 key.properties。
      # 未配置（如公开仓库的 fork PR）时跳过 → release 回退 debug 签名，构建不失败。
      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::未配置 ANDROID_KEYSTORE_BASE64，本次使用 debug 签名"
            exit 0
          fi
          mkdir -p android/keystore
          printf '%s' "$KEYSTORE_B64" | base64 -d > android/keystore/release.jks
          {
            echo "storeFile=../keystore/release.jks"
            echo "storePassword=$STORE_PASS"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASS"
          } > android/key.properties
          echo "keystore 已还原：$(ls -lh android/keystore/release.jks | awk '{print $5}')"

      # 只出 release 包：debug + release 连编会耗尽 GitHub 运行器磁盘。
      # 签名材料来自上一步的 Secrets 还原；缺失时回退 debug 签名（仅用于非发布构建）。
      # --target-platform 限定为 arm/arm64：x86_64 仅模拟器需要，去掉可省约 20MB；
      # 注意 gradle 的 ndk.abiFilters 对 Flutter 预编译引擎库无效，必须用该参数。
      - name: Build release APK
        # 仅 arm64：去掉 x86_64（21MB，真机无用）与 armeabi-v7a（17MB，现代手机不需要），
        # APK 由 ~71MB 降至 ~31MB，下载耗时减半（Cloudflare 线路不支持 Range，无法并行分块）
        run: flutter build apk --release --target-platform android-arm64 --build-name="$VERSION_NAME" --build-number="$VERSION_CODE"

      # 校验 APK 签名证书（公开 fork 缺 key.properties 时会在此明确暴露 debug 回退）
      - name: Verify APK signature
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort | tail -1)
          echo "using $APKSIGNER"
          OUT=$($APKSIGNER verify --print-certs build/app/outputs/flutter-apk/app-release.apk)
          echo "$OUT"
          # 发布标签必须用正式证书（DN 含 SuchMusic）；debug 证书会显示 CN=Android Debug
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if ! echo "$OUT" | grep -q "CN=SuchMusic"; then
              echo "::error::发布包不是正式签名（Secrets 未注入？），已中止发布"
              exit 1
            fi
            CERT_SHA=$(echo "$OUT" | grep -i "SHA-256 digest" | head -1 | awk '{print $NF}')
            echo "正式证书 SHA-256: $CERT_SHA"
          fi

      - name: Collect artifact
        run: |
          mkdir -p artifacts
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # 正式发布：文件名带标签版本号
            NAME="SuchMusic-${GITHUB_REF_NAME}.apk"
          else
            # 滚动构建：固定文件名，覆盖 latest 资源，避免同名堆积
            NAME="SuchMusic-latest.apk"
          fi
          cp build/app/outputs/flutter-apk/app-release.apk "artifacts/$NAME"
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"
          echo "打包版本号: versionName=$VERSION_NAME versionCode=$VERSION_CODE"
          ls -lh artifacts

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuchMusic-release-apk
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

      # 生成 Release 更新日志（保证「有实质内容」）：
      #   · tag 发布：从 CHANGELOG.md 摘取对应版本章节；
      #   · main 滚动发布：附最近提交列表。
      - name: Compose release notes
        run: |
          {
            echo 'RELEASE_BODY<<__RELEASE_BODY_EOF__'
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              NOTES="$(bash scripts/changelog_extract.sh "$VERSION_NAME" || true)"
              if [ -z "${NOTES//[[:space:]]/}" ]; then
                NOTES="未在 CHANGELOG.md 找到 $VERSION_NAME 的章节，请查看仓库 CHANGELOG.md。"
              fi
              echo "$NOTES"
            else
              echo "本次为 main 分支自动构建（内测版 ${VERSION_NAME}，build ${VERSION_CODE}）。"
              echo ""
              echo "### 最近提交"
              git log --no-merges --pretty=format:'- %s' -n 12
              echo ""
            fi
            echo ""
            echo "> 完整变更记录见仓库 CHANGELOG.md。"
            echo '__RELEASE_BODY_EOF__'
          } >> "$GITHUB_ENV"

      # 发布到 Cloudflare Pages 分发仓库（国内下载加速）：
      # 写入新安装包 + update.json，推送后 CF Pages 自动构建，App 端「检查更新」读该域名。
      - name: Publish to CF Pages distribution repo
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          UPDATES_TOKEN: ${{ secrets.UPDATES_REPO_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          bash scripts/changelog_extract.sh "$VERSION_NAME" CHANGELOG.md > /tmp/changelog_section.md || true
          bash scripts/publish_updates.sh \
            "artifacts/${APK_NAME}" "$VERSION_NAME" "$VERSION_CODE" /tmp/changelog_section.md

      # 正式发布：推送 v* 标签时触发，以标签为 Release 名，写入更新日志
      - name: Create Release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/${{ env.APK_NAME }}
          body: ${{ env.RELEASE_BODY }}

      # 滚动发布：每次 push 到 main/master 自动构建签名 APK，
      # 并覆盖更新固定 tag `latest` 的预发布版（同资源名自动替换）
      - name: Update rolling Release (main)
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 'Latest build · v${{ env.VERSION_NAME }} (build ${{ env.VERSION_CODE }})'
          prerelease: true
          make_latest: false
          files: artifacts/${{ env.APK_NAME }}
          body: ${{ env.RELEASE_BODY }}
