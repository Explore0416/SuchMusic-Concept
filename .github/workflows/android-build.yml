name: Android Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Analyze · Test · Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Set up Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Flutter version
        run: flutter --version

      # 仓库内 Gradle wrapper 指向腾讯云镜像（方便国内本地构建）；
      # GitHub 构建机在国外，切回官方分发源更稳更快。仅改 CI 时的临时文件。
      - name: Use official Gradle distribution on CI
        run: |
          sed -i 's|^distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-9.1.0-all.zip|' \
            android/gradle/wrapper/gradle-wrapper.properties
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: Install dependencies
        run: flutter pub get

      # 只分析应用自身代码；vendored 包 packages/netease_music_api/test 含需要私密配置的
      # 上游用例，纳入分析会产生噪声，故与本地保持一致，限定 lib 与 test
      - name: Static analysis
        run: flutter analyze lib test

      - name: Unit / widget tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-release.apk artifacts/SuchMusic-release.apk || true
          cp build/app/outputs/flutter-apk/app-debug.apk   artifacts/SuchMusic-debug.apk   || true
          ls -lh artifacts

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: SuchMusic-apk
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30
